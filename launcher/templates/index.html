<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Zibanka Tools</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            max-width: 720px;
            margin: 48px auto;
            padding: 0 20px;
            color: #222;
            background: #f7f7f7;
            line-height: 1.5;
        }

        .panel {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

            margin: 0 0 20px;
            color: #666;
        }

        ol {
            margin: 0;
            padding-left: 20px;
        }

        li {
            margin-bottom: 12px;
        }

        a {
            color: #26a;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Zibanka Tools</h1>
        <p>Select a tool below.</p>

        <ol>
            <li><a href="{{ fixing_srt_delay_url }}">Fixing SRT Delay</a></li>
            <li><a href="{{ transcription_project_url }}">Transcription Project</a></li>
